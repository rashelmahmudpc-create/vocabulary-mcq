<!DOCTYPE html><html lang=en><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name=theme-color content='#000000'><title>Vocabulary MCQ</title><style>:root{--bg:#000;--card:#0a0a0e;--tx:#f2f2f7;--mu:#8e8e99;--pr:#7c3aed;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0;background:#000;color:var(--tx);font:16px/1.5 system-ui,sans-serif}.w{max-width:680px;margin:0 auto;padding:14px}.c{background:linear-gradient(160deg,#0d0d12,#050507);border:1px solid #1d1d26;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 8px 30px rgba(0,0,0,.8);animation:up .45s both}@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes sk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.shake{animation:sk .35s}.glow{border-color:#22c55e;box-shadow:0 0 0 1px #22c55e55,0 0 28px #22c55e33}.bar{height:6px;background:#17171f;border-radius:9px;overflow:hidden;margin-bottom:10px;position:sticky;top:52px;z-index:5}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#22d3ee);transition:.3s}.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:linear-gradient(90deg,#7c3aed,#3b82f6);color:#fff;margin-bottom:8px}h1{font-size:24px;margin:4px 0;background:linear-gradient(90deg,#c4b5fd,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}h2{font-size:20px;margin:6px 0 12px}.o{display:block;width:100%;text-align:left;background:#0a0a0e;color:var(--tx);border:1.5px solid #23232e;border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer;transition:.15s}.o:hover:not(:disabled){border-color:#7c3aed;background:#12101c}.o:disabled{color:var(--tx);opacity:1}.o.ok{background:rgba(34,197,94,.16);border-color:#22c55e}.o.no{background:rgba(239,68,68,.16);border-color:#ef4444}.ex{margin-top:10px;padding:12px;border-left:4px solid #a78bfa;background:#0f0f16;border-radius:8px;font-size:15px;line-height:1.7;animation:up .3s both}.ex p{margin:6px 0}details{margin-top:10px;background:#0a0a0e;border:1px solid #23232e;border-radius:10px;padding:8px 12px}summary{cursor:pointer;color:#a78bfa;font-weight:600}.b{background:linear-gradient(90deg,#7c3aed,#3b82f6);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:600 16px system-ui;cursor:pointer;width:100%;margin-top:10px}.b.s{background:#0a0a0e;border:1.5px solid #23232e}.big{font-size:44px;font-weight:700;text-align:center;margin:8px 0}.lt{width:100%;text-align:center;cursor:pointer;color:var(--tx);font:inherit;background:radial-gradient(circle at 30% 0,#1b1233,#050507)}.lt:active{transform:scale(.96)}.top{position:sticky;top:0;background:#000;padding:8px 0;z-index:6;display:flex;justify-content:space-between;align-items:center}</style></head><body><div class=w id=app>Loading...</div><script>const $=s=>document.querySelector(s),sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a},pk=a=>a[Math.random()*a.length|0];let LET={},BN={},BW={},BNP={},D,P,PART,Q,sc,done,stk,wrong;const bw=x=>BW[x.toLowerCase()]||'',fm=x=>`<b>${x}</b>${bw(x)?' ('+bw(x)+')':''}`,wd=k=>`<b>${k.split(' (')[0]}</b> (${BN[k]||''})`;async function init(){try{const v='?v='+Date.now(),ix=await(await fetch('data/index.json'+v)).json();const arr=await Promise.all(ix.letters.map(async L=>(await fetch('data/'+L+'.json'+v)).json()));arr.forEach(d=>{LET[d.L]=[d.D,d.P||[]];Object.assign(BN,d.BN||{});Object.assign(BNP,d.BNP||{});(d.BW||'').split('|').forEach(s=>{const t=s.split(':');if(t[1])BW[t[0].toLowerCase()]=t[1]})});home()}catch(e){$('#app').innerHTML='<div class=c>Could not load data. Please refresh.</div>'}}function build(){const Q=[];D.forEach(([w,g,sy,an,gr],i)=>{const other=D.filter((x,j)=>j!=i&&(x[4]==0||x[4]!=gr)),bad=new Set([w,...sy,...an].map(s=>s.toLowerCase())),wn=w.split(' (')[0],sub=w.includes('(')?' ('+w.split('(')[1].replace(')','')+')':'';const mk=(S,list,pool,opp)=>{const ans=pk(list),ds=[],src={},T=S?'Synonym':'Antonym';sh(pool).forEach(([x,s])=>{const l=x.toLowerCase();if(ds.length<3&&!bad.has(l)&&!ds.some(d=>d.toLowerCase()==l)){ds.push(x);src[x]=s}});const more=list.filter(x=>x!=ans);Q.push({t:T,stem:`Which one is the <b>${T.toLowerCase()}</b> of <b>'${wn}'</b>${sub}?`,a:ans,o:sh([ans,...ds]),e:`📖 ${wd(w)} — ${g}।<br><br>✅ <b>কেন সঠিক?</b><br>${fm(ans)} আর ${wd(w)} ${S?'প্রায় একই ভাব বোঝায়, তাই এটি সঠিক Synonym।':'একে অপরের ঠিক উল্টো ভাব বোঝায়, তাই এটি সঠিক Antonym।'}${more.length?`<br>📚 আরও ${T}: ${more.map(fm).join(', ')}`:''}<details><summary>❌ বাকি অপশন কেন ভুল?</summary>${ds.map(x=>`<p>• ${fm(x)} — এটি <b>${wn}</b>-এর ${T} নয়। এটি আসলে ${wd(src[x])} শব্দের ${T}, তাই অর্থ মেলে না।</p>`).join('')}</details><details><summary>🔁 ${S?'Antonym':'Synonym'} জেনে নিন</summary><p>${opp.map(fm).join(', ')}</p></details>`})};mk(1,sy,other.flatMap(x=>x[2].map(s=>[s,x[0]])),an);mk(0,an,other.flatMap(x=>x[3].map(s=>[s,x[0]])),sy)});P.forEach(([s,a,w,e])=>Q.push({t:'Previous Year',stem:s,a,o:sh([a,...w]),e:`📖 ${BNP[a]||''}<br><br>✅ সঠিক উত্তর: ${fm(a)}<details><summary>❌ বাকি অপশন কেন ভুল?</summary>${w.map(x=>`<p>• ${fm(x)} — প্রশ্নে চাওয়া অর্থের সাথে এটি মেলে না।</p>`).join('')}</details><details><summary>📝 বইয়ের নোট</summary><p>${e}</p></details>`}));return sh(Q)}function home(){let h='<h1>📘 Vocabulary MCQ</h1><p style=color:var(--mu)>Choose a letter to start</p><div style='display:grid;grid-template-columns:1fr 1fr;gap:12px'>';for(const L in LET){const [d,p]=LET[L];h+=`<button class='c lt' data-l=${L} onclick=openL(this.dataset.l)><div style=font-size:52px;font-weight:700;color:var(--pr)>${L}</div><div style=color:var(--mu);font-size:14px>${d.length} words · ${d.length*2+p.length} MCQs</div></button>`}$('#app').innerHTML=h+'</div>'}function openL(L){PART=L;[D,P]=LET[L];Q=build();sc=0;done=0;stk=0;wrong=[];$('#app').innerHTML=`<div class=top><button class='b s' style='width:auto;margin:0;padding:8px 14px' onclick=home()>⬅ Back</button><b>${L} · ⭐<span id=sc>0</span>/${Q.length} · 🔥<span id=st>0</span></b></div><div class=bar><i id=pb></i></div>`+Q.map((q,n)=>`<div class=c id=q${n}><span class=tag>${n+1}. ${q.t}</span><h2>${q.stem}</h2>${q.o.map((x,k)=>`<button class=o onclick=pick(${n},${k})>${'ABCD'[k]}. ${x}</button>`).join('')}<div></div></div>`).join('')+'<div id=fin></div>';scrollTo(0,0)}function pick(n,k){const q=Q[n],c=$('#q'+n),bs=c.querySelectorAll('.o');if(bs[0].disabled)return;bs.forEach((b,j)=>{b.disabled=true;if(q.o[j]==q.a)b.classList.add('ok');if(bw(q.o[j]))b.insertAdjacentHTML('beforeend','<br><small style=color:var(--mu)>'+bw(q.o[j])+'</small>')});const r=q.o[k]==q.a;if(r){sc++;stk++;c.classList.add('glow')}else{stk=0;bs[k].classList.add('no');wrong.push(q);c.classList.add('shake')}c.lastElementChild.innerHTML=`<div class=ex>${r?pk(['🎉 দারুণ! সঠিক উত্তর','🔥 চমৎকার! একদম ঠিক','💪 শাবাশ! ঠিক হয়েছে','⚡ পারফেক্ট!'])+(stk>=3?' · '+stk+'টা টানা!':''):'❌ ভুল হয়েছে। সঠিক উত্তর: <b>'+q.a+'</b>'}<br><br>${q.e}</div>`;$('#sc').textContent=sc;$('#st').textContent=stk;$('#pb').style.width=(done+1)/Q.length*100+'%';if(++done==Q.length)$('#fin').innerHTML=`<div class=c><div class=big>${sc} / ${Q.length}</div><p style=text-align:center>${sc/Q.length>=.8?'🏆 অসাধারণ, স্যার!':sc/Q.length>=.5?'👍 ভালো হয়েছে, আরেকবার দিলে ১০০% হবে':'📚 শব্দগুলো আবার দেখে নিয়ে চেষ্টা করুন'}</p><button class=b onclick=openL(PART)>🔀 নতুন করে শাফল করে দিন</button><button class='b s' onclick=home()>Back to letters</button></div>`}init();</script></body></html>
